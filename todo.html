<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do — Felipe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-texto">
        <h1>To-do list</h1>
        <p>Semana 2 · JavaScript</p>
      </div>
      <nav aria-label="Navegação">
        <a href="index.html">Página pessoal</a>
      </nav>
    </header>

    <main>
      <section id="todo">
        <h2>Minhas tarefas</h2>
        <form id="form-todo">
          <label for="nova-tarefa">Nova tarefa</label>
          <input
            id="nova-tarefa"
            type="text"
            placeholder="Ex.: revisar HTML"
          />
          <button type="submit">Adicionar</button>
        </form>
        <ul id="lista-tarefas"></ul>
      </section>
    </main>

    <footer>
      <p>Semana 2 · Guia em SEMANA-2.md</p>
    </footer>

    <script src="todo.js"></script>
  </body>
</html>
